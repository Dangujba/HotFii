# HotFii SQL module for FreeRADIUS.
#
# Instance name must stay `sql`: sites-available/default calls it as a bare
# `-sql`, and a differently named instance is never reached.
#
# Rendered from this template by the entrypoint. envsubst is given an explicit
# variable list, so FreeRADIUS's own ${dialect} and ${modconfdir} survive intact.

sql {
    dialect = "postgresql"
    driver = "rlm_sql_${dialect}"

    server = "${RADIUS_DB_HOST}"
    port = ${RADIUS_DB_PORT}
    login = "${RADIUS_DB_USER}"
    password = "${RADIUS_DB_PASSWORD}"

    # In FreeRADIUS 3 this is the database name, not a table prefix.
    radius_db = "${RADIUS_DB_NAME}"

    # Routers are rows in the nas table, written by HotFii when an operator adds
    # a device. Clients are read once at start-up, so a newly added router needs
    #   docker compose restart freeradius
    # before it can authenticate. See docs/DOCKER_VPS_DEPLOYMENT.md.
    read_clients = yes
    client_table = "nas"

    # HotFii writes access-group membership to radusergroup and the group's
    # reply attributes to radgroupreply.
    group_attribute = "SQL-Group"

    # Accounting rows are inserted by FreeRADIUS and read back by the
    # ReconcileRadiusAccounting job; nothing here deletes.
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    authreply_table = "radreply"
    groupcheck_table = "radgroupcheck"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"

    # Keep an accounting Start that arrives without a matching Stop rather than
    # silently discarding it; the reconcile job closes stale rows.
    delete_stale_sessions = no

    # Set to yes only while debugging: it writes every statement, including the
    # Cleartext-Password lookups, to the log.
    sqltrace = no

    pool {
        start = 3
        min = 2
        max = 16
        spare = 3
        uses = 0
        retry_delay = 30
        lifetime = 0
        idle_timeout = 60
    }

    # The stock query set. Column names in HotFii's Laravel migrations were
    # chosen to match this schema exactly, so it is used verbatim.
    # ${.:name} resolves to this instance's name, i.e. sql.
    $INCLUDE ${modconfdir}/${.:name}/main/${dialect}/queries.conf
}
