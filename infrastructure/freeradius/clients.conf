# HotFii RADIUS clients.
#
# Real routers are NOT listed here. HotFii writes them to the nas table when an
# operator registers a device, and the sql module loads them at start-up
# (read_clients = yes). That is what keeps per-tenant secrets out of any file.
#
# This file exists only so `radtest` works from inside the container:
#
#   docker compose exec freeradius \
#       radtest <username> <password> 127.0.0.1 0 <RADIUS_LOCALHOST_SECRET>
#
# Rendered from a template by the entrypoint.

client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = "${RADIUS_LOCALHOST_SECRET}"
    require_message_authenticator = no
    nas_type = other

    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

client localhost_ipv6 {
    ipv6addr = ::1
    secret = "${RADIUS_LOCALHOST_SECRET}"
}
