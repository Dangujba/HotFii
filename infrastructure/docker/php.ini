; HotFii PHP runtime tuning. Loaded after the distribution defaults.

memory_limit = 512M
max_execution_time = 60
post_max_size = 24M
upload_max_filesize = 16M
date.timezone = Africa/Lagos
expose_php = Off

; Log to the container's stderr so `docker compose logs` is the single place to
; look for PHP errors.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
; Application code is immutable inside the image, so never stat files for
; changes. A new release means a new container.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
