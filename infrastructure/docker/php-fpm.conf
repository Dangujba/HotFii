[www]

; PHP-FPM defaults to clear_env = yes, which would strip every variable Compose
; injects and leave env('DB_HOST') and friends null inside web requests. This
; single line is what makes the .env file supplied through env_file work.
clear_env = no

; Sized for a small VPS. Raise pm.max_children once you know the real per-worker
; memory footprint: max_children x ~64 MB should stay well under available RAM.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker stdout/stderr in `docker compose logs app`.
catch_workers_output = yes
decorate_workers_output = no

; Long-running report exports and PDF generation get a little more headroom than
; the PHP default, while still bounding a stuck request.
request_terminate_timeout = 120
